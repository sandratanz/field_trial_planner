# Builds the Field Trial Planner Shiny app into a static, WebAssembly-based
# site (via shinylive) and publishes it to GitHub Pages.
#
# You do not need R installed anywhere to use this — the build step below
# runs entirely on GitHub's servers. It triggers automatically on every
# push to `main`, and can also be run manually from the Actions tab.
#
# One-off setup required in the repo settings:
#   Settings -> Pages -> Build and deployment -> Source -> "GitHub Actions"

name: Deploy Shinylive app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    uses: posit-dev/r-shinylive/.github/workflows/deploy-app.yaml@actions-v1
